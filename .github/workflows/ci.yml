name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The committed bundle is what developers run. It must be exactly what this
      # source produces.
      - name: Committed bundle matches the source
        run: |
          if ! git diff --exit-code -- plugins/susaplay/server/susaplay-mcp.mjs; then
            echo "::error::plugins/susaplay/server/susaplay-mcp.mjs is out of date. Run 'npm run build' and commit it."
            exit 1
          fi
      # Claude Code keeps an installed plugin on its cached copy until the
      # manifest's version changes, so the plugin and the server move together.
      - name: Plugin version matches the server version
        run: |
          server=$(node -p "require('./packages/mcp-server/package.json').version")
          plugin=$(node -p "require('./plugins/susaplay/.claude-plugin/plugin.json').version")
          if [ "$server" != "$plugin" ]; then
            echo "::error::plugins/susaplay/.claude-plugin/plugin.json has version $plugin; the server is $server. Set both to the same version."
            exit 1
          fi

  # The committed bundle — checked against the source above — has no
  # dependencies, so it runs on every supported Node.js and operating system
  # without an install.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node packages/mcp-server/scripts/smoke.mjs plugins/susaplay/server/susaplay-mcp.mjs

  # The one status check the branch ruleset requires.
  ci:
    needs: [build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success && test "${{ needs.smoke.result }}" = success
