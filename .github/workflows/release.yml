name: release

# A maintainer pushes the tag vX.Y.Z on a commit of main whose package version
# is X.Y.Z; the version bump itself goes through a pull request like any other
# change. Only admins can create v* tags (the "release tags" ruleset). This job
# publishes that commit to npm through trusted publishing — no token, with
# provenance — and creates the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: The tag is on main and matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Tag a commit that has been merged."
            exit 1
          fi

      - name: npm supports trusted publishing
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} cannot use trusted publishing; 11.5.1 or later is needed.`);
              process.exit(1);
            }
          ' "$(npm --version)"

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle matches the source
        run: |
          if ! git diff --exit-code -- plugins/susaplay/server/susaplay-mcp.mjs; then
            echo "::error::The committed bundle is out of date. Rebuild it in a pull request before tagging."
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/mcp-server
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-release (1.2.0-beta) must not become what `npm install` gets.
          case "$TAG" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $prerelease
